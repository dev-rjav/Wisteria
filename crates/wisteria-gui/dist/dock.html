<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wisteria Dock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Doto', ui-monospace, monospace; }
    :root { --magenta: #e879f9; --magenta-light: #f5d0fe; --magenta-deep: #d946ef; --muted: #8a8a90; }
    @keyframes fa-bloom { 0% { transform: scale(.94); opacity: .5 } 100% { transform: scale(1); opacity: 1 } }
    @keyframes fa-dot { 0%, 100% { opacity: .4; transform: scale(.85) } 50% { opacity: 1; transform: scale(1) } }
    .wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 8px; }
    .dock {
      display: flex; align-items: center; gap: 14px; padding: 0 18px; width: 100%; height: 100%;
      border-radius: 999px; background: rgba(14, 14, 17, .94); backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .09); box-shadow: 0 14px 40px rgba(0, 0, 0, .6);
      transition: border-color .3s, box-shadow .3s; animation: fa-bloom .4s cubic-bezier(.16, 1, .3, 1);
    }
    .dock.bright { border-color: rgba(232, 121, 249, .4); box-shadow: 0 18px 55px rgba(232, 121, 249, .22), 0 10px 30px rgba(0, 0, 0, .7); }
    .grip { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; opacity: .4; cursor: grab; }
    .grip i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: #3a3a40; transition: background .3s; }
    .dot.live { background: var(--magenta); box-shadow: 0 0 12px var(--magenta); animation: fa-dot 1s ease-in-out infinite; }
    .dot.proc { background: var(--magenta-deep); }
    .cv-wrap { flex: 1; position: relative; height: 100%; min-width: 0; }
    .cv-wrap canvas { width: 100%; height: 100%; display: block; }
    .readout { display: none; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
    .readout.show { display: flex; }
    .time { font-size: 17px; font-weight: 800; color: var(--magenta-light); line-height: 1; }
    .wds { font-size: 10px; letter-spacing: 1px; color: #7a7a80; font-weight: 600; }
    .hint { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); padding: 7px 12px; border-radius: 10px; background: #17171a; border: 1px solid rgba(255, 255, 255, .1); font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #c9c9ce; white-space: nowrap; display: none; }
    .hint.show { display: block; }
    .hint b { color: var(--magenta); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="dock" id="dock" data-tauri-drag-region>
      <div class="hint" id="hint">HOLD <b id="hint-key">F8</b> TO TALK</div>
      <div class="grip"><i></i><i></i><i></i></div>
      <div class="dot" id="dot"></div>
      <div class="cv-wrap"><canvas id="dock-canvas"></canvas></div>
      <div class="readout" id="readout">
        <span class="time" id="time">00:00</span>
        <span class="wds" id="wds">0 WORDS</span>
      </div>
    </div>
  </div>
  <script src="wave.js"></script>
  <script src="dock.js"></script>
</body>
</html>
