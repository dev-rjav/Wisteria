[package]
name = "wisteria-gui"
description = "Wisteria desktop app (Tauri v2) — the Flow App workspace UI over the dictation engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "wisteria-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
wisteria-core = { path = "../wisteria-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Enforce a single running instance: a second launch surfaces the existing window instead of
# spawning a duplicate process (extra dock + tray + engine).
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json = "1"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Blocking HTTP to the local Ollama server (list + pull models). rustls avoids OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
